name: Preflight – availability & priority hash

on:
  workflow_dispatch:
  push:
    branches:
      - preflight_check
  schedule:
    - cron: "0 3 * * *" # optional daily run

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: ./scraper

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml redis

      - name: Debugging
        run: |
          pwd
          ls -la
          cd ../ && ls -la

      - name: Run preflight
        env:
          REDIS_HOST: redis
          REDIS_PORT: 6379
          REDIS_PASSWORD: ${{secrets.REDIS_HOST_PASSWORD}}
        run: |
          python workflow/preflight_job.py \
            --input sources.csv \
            --timeout 10 \
            --out preflight-results.jsonl

      - name: Upload preflight results
        uses: actions/upload-artifact@v4
        with:
          name: preflight-results
          path: "**/preflight-results.jsonl"
