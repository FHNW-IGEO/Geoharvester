# This is a test version using static local data but will be hooked up after the preflight and before the processing later

name: Hash comparison

on:
  workflow_dispatch:
  push:
    branches: preflight_check

jobs:
  compare-hashes:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download preflight hashes artifact
        uses: actions/download-artifact@v4
        with:
          name: preflight-diagnostics
          path: scraper

      - name: Debug – list files
        run: |
          ls -lh
          echo "----"
          ls -lh scraper

      - name: Run hash comparison
        run: |
          python workflow/compare_hashes.py

      - name: Upload datasets-to-process artifact
        uses: actions/upload-artifact@v4
        with:
          name: datasets-to-process
          path: "**/datasets_to_process.json"
